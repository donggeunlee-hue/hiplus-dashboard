<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하이플러스 경영실적 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#F6F8FA]">
  <div id="root"></div>
  <script type="text/babel">
    // 대시보드 컴포넌트 로직 자동 실행
    window.addEventListener('DOMContentLoaded', () => {
      const { useState, useEffect, useMemo, useRef } = React;
      const { ResponsiveContainer, ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip } = Recharts;

      function DashboardApp() {
        return (
          <div class="p-8 text-center font-bold text-slate-800 text-xl">
            <h2>하이플러스 대시보드가 성공적으로 로드되었습니다.</h2>
            <p class="text-sm text-slate-500 mt-2">구글 시트 연동 데이터를 불러오는 중입니다...</p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
    });
  </script>
</body>
</html>
